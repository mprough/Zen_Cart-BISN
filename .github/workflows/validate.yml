name: Validate BISN
on: [push, pull_request, workflow_dispatch]
jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.0', '8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
      - run: find files tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: git diff --check
      - run: python3 tests/check-package.py
  integration:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - {zc: '2.1.0', php: '8.0'}
          - {zc: '2.1.0', php: '8.1'}
          - {zc: '2.1.0', php: '8.2'}
          - {zc: '2.1.0', php: '8.3'}
          - {zc: '2.2.2', php: '8.2'}
          - {zc: '2.2.2', php: '8.3'}
          - {zc: '2.2.2', php: '8.4'}
          - {zc: '2.2.2', php: '8.5'}
    services:
      mariadb:
        image: mariadb:10.11
        env:
          MARIADB_ROOT_PASSWORD: bisn-test
        ports: ['3306:3306']
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: zencart/zencart
          ref: v${{ matrix.zc }}
          path: .test-core
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mysqli
          coverage: none
      - run: php tests/integration.php
        env:
          ZEN_CART_ROOT: ${{ github.workspace }}/.test-core
          BISN_DB_PASSWORD: bisn-test
